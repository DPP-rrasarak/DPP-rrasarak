cat << 'EOF' > responsive.html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }

        table {
            width: 100%;
            height: 100vh;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td style="background-color: pink;">First cell</td>
            <td style="background-color: blue;">Second cell</td>
        </tr>
    </table>

</body>
</html>
EOF
