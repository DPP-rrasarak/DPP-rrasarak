<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            height: 300px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td style="background-color: pink;">First cell</td>
            <td style="background-color: blue;">Second cell</td>
        </tr>
    </table>

</body>
</html>
