<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="calc.css">
</head>
<body>
  <div class="calculator">
    <input type="text" id="left-operand" placeholder="Left operand">
    
    <select id="operator">
      <option value="+">+</option>
      <option value="-">-</option>
      <option value="*">*</option>
      <option value="/">/</option>
      <option value="%">%</option>
    </select>
    
    <input type="text" id="right-operand" placeholder="Right operand">
    
    <input type="submit" id="submit-btn" value="Try me!">
  </div>

  <script src="calc.js"></script>
</body>
</html>
